(function () {

const fmtDate = s => { const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}`; };
const fmtDateFull = s => { const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };

const fmtN = n => (Math.round(n) || 0).toLocaleString('es-AR');
const fmtPesos = n => '$ ' + Math.round(n).toLocaleString('es-AR');

const uid = () => Math.random().toString(36).slice(2, 9);

const ROLES = {

};

  administrador:      ['tablero', 'pedido.crear', 'pedido.preparar', 'pedido.recibir', 'remito.crear', 'inventario.cargar', 'inventario.cerrar', 'ventas.importar', 'productos.editar', 'config'],
  encargado_local:    ['tablero', 'pedido.crear', 'pedido.recibir', 'inventario.cargar', 'inventario.cerrar', 'ventas.importar'],
  encargado_deposito: ['pedido.preparar', 'remito.crear', 'inventario.cargar', 'inventario.cerrar'],

function pesoVigente(p, fecha) {
  if (p.grupo !== 'helado_granel') return null;
  const f = fecha || iso(HOY);
  const lista = (p.pesoCaja && p.pesoCaja.length) ? p.pesoCaja : [{ kg: 7.8, desde: '2000-01-01' }];
  const v = lista.filter(x => x.desde <= f).sort((a, b) => a.desde < b.desde ? 1 : -1)[0] || lista[lista.length - 1];
  return Number(v.kg);
}
function aBase(p, cantidad, unidad, fecha) {

  if (p.grupo === 'helado_granel') return unidad === 'caja' ? cantidad * pesoVigente(p, fecha) : cantidad;
  const e = p.equiv || { unidadesPorCaja: 1, cajasPorPack: 1 };
  if (unidad === 'caja') return cantidad * e.unidadesPorCaja;
  if (unidad === 'pack') return cantidad * e.cajasPorPack * e.unidadesPorCaja;
  return cantidad;
}
function unidadBaseLabel(p) { return p.grupo === 'helado_granel' ? 'kg' : 'u'; }

})();

// Gráficos SVG a mano
function chartBarras(rows, series, pref, unidad) {
  const W = 520, H = 200, padL = 40, padR = 8, padT = 12, padB = 26;
  const max = Math.max(1, ...rows.flatMap(r => series.map(l => r[pref + l.id] || 0)));
  const nice = niceMax(max);
  const gw = (W - padL - padR) / rows.length, bw = Math.min(22, (gw - 8) / series.length);
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; g += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${nice < 5 ? fmtKg(v) : fmtN(v)}</text>`; }
  rows.forEach((r, ri) => {
    const x0 = padL + gw * ri + (gw - bw * series.length) / 2;
    series.forEach((l, si) => {
      const v = r[pref + l.id] || 0, x = x0 + si * bw + 1, h = y(0) - y(v);
      g += `<rect x="${x}" y="${y(v)}" width="${bw - 2}" height="${Math.max(0, h)}" rx="3" fill="var(--s${si + 1})"/>`;
      g += `<rect class="hit" x="${x - 2}" y="${padT}" width="${bw + 2}" height="${H - padT - padB}" data-tip="${esc(l.nombre)} · sem. ${r.label}: ${fmtKg(v)} ${unidad}"/>`;
    });
    g += `<text x="${padL + gw * ri + gw / 2}" y="${H - 8}" text-anchor="middle">${r.label}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas semanales de helado en kilos por local">${g}</svg><div class="tip"></div></div>`;
}
function chartLineas(rows, series, pref) {
  const W = 520, H = 180, padL = 40, padR = 12, padT = 12, padB = 26;
  const vals = rows.flatMap(r => series.map(l => r[pref + l.id])).filter(v => v !== null && v !== undefined);
  const lim = Math.max(A.S.config.umbralRojo * 1.5, 1, ...vals.map(Math.abs));
  const top = Math.ceil(lim);
  const y = v => padT + (H - padT - padB) * (1 - (v + top) / (2 * top));
  const x = i => padL + (W - padL - padR) * (rows.length === 1 ? 0.5 : i / (rows.length - 1));
  let g = '';
  for (const v of [-top, -A.S.config.umbralRojo, 0, A.S.config.umbralRojo, top]) {
    const isU = Math.abs(v) === A.S.config.umbralRojo && v !== 0;
    g += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" ${isU ? 'stroke-dasharray="4 4" style="stroke:var(--rojo)"' : v === 0 ? 'style="stroke:var(--muted)"' : ''}/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? '+' : ''}${v}%</text>`;
  }
  series.forEach((l, si) => {
    const pts = rows.map((r, i) => ({ x: x(i), v: r[pref + l.id], label: r.label })).filter(p => p.v !== null && p.v !== undefined);
    if (!pts.length) return;
    g += `<polyline fill="none" stroke="var(--s${si + 1})" stroke-width="2" stroke-linejoin="round" points="${pts.map(p => `${p.x},${y(p.v)}`).join(' ')}"/>`;
    pts.forEach(p => { g += `<circle cx="${p.x}" cy="${y(p.v)}" r="4" fill="var(--s${si + 1})" stroke="var(--surface)" stroke-width="2"/><circle class="hit" cx="${p.x}" cy="${y(p.v)}" r="12" data-tip="${esc(l.nombre)} · sem. ${p.label}: ${fmtPct(p.v)}"/>`; });
  });
  rows.forEach((r, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${r.label}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Desvío semanal en porcentaje por local, con la línea del umbral rojo">${g}</svg><div class="tip"></div></div>`;
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return m * p; }

    if (p && cant && +cant > 0 && +cant < 1000) { const porPack = esPack ? ((p.equiv && p.equiv.cajasPorPack) || 1) : 1; ok.push({ id: p.id, cant: +cant * porPack, txt: etiqueta + (esPack ? ` · ${cant} pack${+cant > 1 ? 's' : ''} × ${porPack} cj` : '') }); }
    else if (p) dudas.push(etiqueta + ' (cantidad ilegible)');
    else if (!fallback && etiqueta.length >= 3) dudas.push(etiqueta + (cant ? ' (' + cant + ')' : ' (cantidad ilegible)'));
  }
  return { ok, dudas };
}
function cargarScript(src) { return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('No se pudo cargar el lector de texto')); document.head.appendChild(s); }); }
function imagenPreparada(file) {
  return new Promise((ok, no) => { const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const max = 2200; const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height); const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
      for (let i = 0; i < px.length; i += 4) { const y = px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11; const v = Math.max(0, Math.min(255, (y - 110) * 1.9 + 128)); px[i] = px[i + 1] = px[i + 2] = v; }
      g.putImageData(d, 0, 0); URL.revokeObjectURL(url); ok(c); };
    img.onerror = () => no(new Error('No se pudo abrir la imagen')); img.src = url; });
}
// PDF digital (factura o remito bajado de la intranet): se lee el texto directo, sin OCR
async function textoDePdf(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const lineas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const filas = new Map();
    for (const it of tc.items) { if (!it.str || !it.str.trim()) continue; const y = Math.round(it.transform[5] / 3); if (!filas.has(y)) filas.set(y, []); filas.get(y).push({ x: it.transform[4], s: it.str }); }
    [...filas.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => lineas.push(its.sort((a, b) => a.x - b.x).map(i => i.s).join(' ').replace(/\s+/g, ' ').trim()));
  }
  return lineas.join('\n');
}
async function leerRemitoFoto() {
  const S = A.S, d = UI.params.draft; if (!d || !d.file) return toast('Primero sacá la foto del remito');
  const esPdf = /pdf$/i.test(d.file.type) || /\.pdf$/i.test(d.file.name);
  await cargarScript(esPdf ? 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js' : 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
  let texto = '';
  if (/pdf$/i.test(d.file.type) || /\.pdf$/i.test(d.file.name)) texto = await textoDePdf(d.file);
  else {
    const canvas = await imagenPreparada(d.file);
    const worker = await Tesseract.createWorker('spa', 1, { logger: m => { if (m.status === 'recognizing text') { const t = $('#toast'); t.textContent = 'Leyendo la foto… ' + Math.round(m.progress * 100) + ' %'; t.classList.add('show'); } } });
    try { const r = await worker.recognize(canvas); texto = r.data.text || ''; } finally { await worker.terminate(); }
  }
  const up = texto.toUpperCase();
  // Helacor provee a los dos depósitos: el destino se decide por lo que dice la hoja (Vía Bana / Heladería Social → Dep. Sociales; si no, Cámara)
  if (/HELACOR|GRIDO|V[IÍ]A\s*BANA/.test(up)) { const ph = S.proveedores.find(x => /helacor|grido/i.test(x.nombre)); if (ph) d.proveedorId = ph.id; }
  const esSocial = /V[IÍ]A\s*BANA|HELADER[IÍ]A\s*SOCIAL/.test(up);
  const destino = S.sucursales.find(x => x.tipo === 'deposito' && (esSocial ? /social/i.test(x.nombre) : !/social/i.test(x.nombre)));
  const puedeDestino = destino && (UI.user.rol === 'administrador' || UI.user.sucursales.includes(destino.id));
  if (puedeDestino && destino.id !== d.sucursalId) { d.sucursalId = destino.id; d.items = {}; }
  const cam = A.suc(d.sucursalId); const candidatos = S.productos.filter(p => p.activo && P.enSuc(p, cam.id));
  const { ok, dudas } = parsearLineas(texto, candidatos, S.mapeo);
  const mNum = texto.match(/N[º°o]?\s*(\d{4,5})\s*[-–]\s*(\d{6,9})/) || texto.match(/\b(\d{4,5})-(\d{8})\b/); if (mNum && !d.numero) d.numero = mNum[1] + '-' + mNum[2];
  const mFecha = texto.match(/\b(\d{2})[\/.](\d{2})[\/.](20\d{2})\b/); if (mFecha) d.fecha = `${mFecha[3]}-${mFecha[2]}-${mFecha[1]}`;
  const mTot = texto.match(/TOTAL[:\s]*(\d{1,5})\b/i); const total = mTot ? +mTot[1] : null;
  for (const l of ok) d.items[l.id] = (d.items[l.id] || 0) + l.cant;
  d.ocr = { ok, dudas, total, destino: A.suc(d.sucursalId).nombre, pista: esSocial ? 'la hoja menciona Vía Bana / Heladería Social' : 'la hoja no menciona Vía Bana' };
  render(); window.scrollTo(0, 0);
  toast(ok.length ? `Reconocí ${ok.length} productos` : 'No pude leer productos en la foto; probá con más luz y la hoja derecha');
}
function leerExcel(file) {
  const rd = new FileReader();
  rd.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
      const filas = rows.map(r => { const o = {}; for (const k in r) o[norm(k)] = r[k]; const fecha = o.fecha instanceof Date ? iso(o.fecha) : String(o.fecha || '').slice(0, 10).split('/').length === 3 ? String(o.fecha).split('/').reverse().map((x, i) => i === 0 && x.length === 2 ? '20' + x : x).join('-') : String(o.fecha || iso(HOY)).slice(0, 10);
        return { fecha, codigoExt: String(o.codigo || o.sku || o.articulo || '').trim(), nombre: String(o.descripcion || o.producto || o.nombre || ''), cantidad: parseFloat(o.cantidad || o.cant || 0) || 0, importe: parseFloat(o.importe || o.total || o.monto || 0) || 0 }; }).filter(f => f.codigoExt);
      if (!filas.length) return toast('No se encontraron filas con columna "codigo"');
      UI.params.draft.filas = filas; UI.params.draft.nombre = file.name; UI.params.draft.sucursalId = $('#imp_suc').value; render();
    } catch (err) { toast('No se pudo leer el archivo: ' + err.message); }
  };
  rd.readAsArrayBuffer(file);
}

document.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (!h) return; const c = h.closest('.chart'), tip = c.querySelector('.tip'); tip.textContent = h.dataset.tip; const r = h.getBoundingClientRect(), cr = c.getBoundingClientRect(); tip.style.left = (r.left + r.width / 2 - cr.left) + 'px'; tip.style.top = (r.top - cr.top + 8) + 'px'; tip.classList.add('show'); });
document.addEventListener('pointerout', e => { const h = e.target.closest('.hit'); if (!h) return; h.closest('.chart').querySelector('.tip').classList.remove('show'); });
